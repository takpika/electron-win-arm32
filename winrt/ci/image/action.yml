name: Builder image
description: Builds (or restores from the Actions cache) the builder image as winrt-builder.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: winrt/ci
        file: winrt/ci/Dockerfile
        tags: winrt-builder
        load: true
        cache-from: type=gha,scope=winrt-builder
        cache-to: type=gha,mode=max,scope=winrt-builder
