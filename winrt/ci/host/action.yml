name: Build host
description: >-
  Prepares the runner: /home/winrt, swap, and disk space. On the x86_64 runners the preinstalled
  toolsets this build never uses are removed; where they also have a second disk on /mnt,
  /home/winrt lives on /mnt and the build directory (OUT, once the checkout exists) on the root
  file system. Otherwise (aarch64 runners, single-disk x86_64 runners) everything stays on the
  root file system.
inputs:
  swap:
    description: swap to add, in GiB (0 for none)
    default: '0'
  min_free_gb:
    description: >-
      stop here (within minutes, not hours into the build) unless the root file system, where the
      build directory lives, has at least this much free space after the cleanup (0: no check)
    default: '0'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -eu
        if [ "$(uname -m)" = x86_64 ]; then
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm \
            /opt/microsoft /opt/google /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/az /usr/share/miniconda
          sudo docker image prune -a -f >/dev/null
        fi
        if [ "$(uname -m)" = x86_64 ] && mountpoint -q /mnt; then
          sudo mkdir -p /mnt/winrt /home/winrt
          sudo chown "$(id -u):$(id -g)" /mnt/winrt
          sudo mount --bind /mnt/winrt /home/winrt
          echo "WINRT_OUT_DISK=/var/winrt-out" >> "$GITHUB_ENV"
        else
          sudo mkdir -p /home/winrt
        fi
        sudo chown "$(id -u):$(id -g)" /home/winrt
        if [ "${{ inputs.swap }}" != 0 ]; then
          sudo swapoff -a || true
          sudo fallocate -l "${{ inputs.swap }}G" /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
        fi
        free -g; df -h / /mnt /home/winrt
        need=${{ inputs.min_free_gb }}
        if [ "$need" != 0 ]; then
          have=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$have" -lt "$need" ]; then
            echo "::error::only ${have} GB free on / after the cleanup; this stage needs at least ${need} GB" \
                 "(winrt/ci/host). The runner image's disk layout or preinstalled software has changed."
            exit 1
          fi
          echo "disk check: ${have} GB free on / (needs ${need} GB)"
        fi
